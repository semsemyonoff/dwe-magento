group:
  bridge:
    enabled: true
    services: [magento]
  title: Magento System Info
  description: System inspection via n98-magerun2 (commands native bin/magento does not provide)

commands:
  info:
    type: service_exec
    description: Print an overview of the Magento system — version, edition, modes, caches (`n98-magerun2 sys:info`)
    service: app-magento
    mode: exec-or-run
    workdir_from: services.magento.work_dir_internal
    argv: [n98-magerun2, "sys:info"]

  check:
    type: service_exec
    description: Run n98-magerun2's system health checks (`n98-magerun2 sys:check`)
    service: app-magento
    mode: exec-or-run
    workdir_from: services.magento.work_dir_internal
    argv: [n98-magerun2, "sys:check"]
