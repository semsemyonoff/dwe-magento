group:
  bridge:
    enabled: true
    services: [magento]
  title: Magento Maintenance
  description: Magento maintenance-mode helpers (`bin/magento maintenance:*`) for the magento service

commands:
  enable:
    type: service_exec
    description: Put the store into maintenance mode (`bin/magento maintenance:enable`)
    service: app-magento
    argv: [bin/magento, "maintenance:enable"]

  disable:
    type: service_exec
    description: Take the store out of maintenance mode (`bin/magento maintenance:disable`)
    service: app-magento
    argv: [bin/magento, "maintenance:disable"]

  status:
    type: service_exec
    description: Show maintenance-mode status (`bin/magento maintenance:status`)
    service: app-magento
    argv: [bin/magento, "maintenance:status"]
