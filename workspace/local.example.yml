# Template for local overrides (layer 3 of the merged config).
# Copy this file to local.yml and adjust as needed.
# local.yml is NOT tracked by git.

# Free-form, project-specific values live under the strict-root `vars:` sandbox
# (the merged config root only allows schema_version/project/runtime/exports/
# compose/docs/services/vars/update/bridge/stop/secrets). Everything that used to
# sit at the root of this file — magento.*, db.*, debug.* — now nests under `vars:`.
vars:
  # REQUIRED — Magento Marketplace (repo.magento.com) access keys. Deploy generates
  # services/magento/home/.composer/auth.json from these so composer can download
  # Magento. Get them at https://commerce.adobe.com → My Profile → Access Keys
  # (Public Key = username, Private Key = password). `dwe deploy run` fails fast
  # if they are blank.
  magento:
    marketplace:
      username: ""
      password: ""
    # Optional locale overrides (defaults: en_US / USD / UTC). These feed
    # `setup:install`; you can also override per-run, e.g.
    # `dwe cmd services.magento.setup.install --set language=ru_RU --set currency=RUB`.
    # Example: switch the store to Russian.
    # locale:
    #   code: ru_RU
    #   timezone: Europe/Moscow
    # currency:
    #   base: RUB
    #   default: RUB
    #   allow: RUB

# Toggle optional services (apps and tools) without changing project defaults.
# services:
#   dbgate:
#     enabled: true
#   opensearch-dashboards:
#     enabled: true
#   elasticvue:
#     enabled: true
#   redis-insight:
#     enabled: true
#   varnish:
#     enabled: true        # full-page cache; switch Magento over with
#                          # `dwe cmd services.magento.varnish.enable`
#   magento-debug:
#     enabled: false       # Xdebug container — adds its compose overlay automatically

# Override a service's port or host (deep-merged by entry name — only the listed
# keys change). Useful when a port clashes with something on your host.
# services:
#   magento:
#     hosts:
#       web: magento.test     # the storefront hostname (also set magento.base_url)
#   nginx:
#     ports:
#       http: 8080            # the published web port (APP_PORT)
#   dbgate:
#     ports:
#       http: 8081

# Override runtime flags / infra ports (db, valkey, search).
# runtime:
#   use_https: true
#   ports:
#     db: 13307
#     valkey: 6380
#     search: 9201

# Override database credentials if needed (default: root / root).
# Free-form values nest under vars: (same sandbox as the marketplace keys above).
# vars:
#   db:
#     user: myuser
#     password: mypassword
#   # Override the Magento sample edition/version installed on first deploy.
#   magento:
#     sample:
#       edition: community
#       version: 2.4.8-p4
#   # Xdebug IDE key for cookie-based debug routing (default: PHPSTORM).
#   debug:
#     idekey: VSCODE
