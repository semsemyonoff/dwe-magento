# Overlay: Elasticvue — lightweight OpenSearch/Elasticsearch GUI.
# Enabled when services.elasticvue.enabled = true in dwe config.
# Pre-seeded with the local OpenSearch cluster.

services:
  nginx:
    volumes:
      - ./configs/nginx/templates/tools/elasticvue.conf.template:/etc/nginx/templates/elasticvue.conf.template:ro
    environment:
      ELASTICVUE_HOST: "${ELASTICVUE_HOST:-elasticvue.localhost}"

  elasticvue:
    image: "${IMAGE_ELASTICVUE:-cars10/elasticvue:latest}"
    hostname: elasticvue
    restart: unless-stopped
    ports:
      - "${ELASTICVUE_PORT:-8026}:8080"
    environment:
      ELASTICVUE_CLUSTERS: |
        [
          {"name": "Local", "uri": "http://localhost:${SEARCH_PORT:-9200}"}
        ]
    depends_on:
      - opensearch
