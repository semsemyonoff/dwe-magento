# Overlay: OpenSearch Dashboards — web UI for inspecting OpenSearch indices.
# Enabled when services.opensearch-dashboards.enabled = true in dwe config.

services:
  nginx:
    volumes:
      - ./configs/nginx/templates/tools/opensearch.conf.template:/etc/nginx/templates/opensearch.conf.template:ro
    environment:
      OPENSEARCH_DASHBOARDS_HOST: "${OPENSEARCH_DASHBOARDS_HOST:-opensearch.localhost}"

  opensearch-dashboards:
    image: "${IMAGE_OPENSEARCH_DASHBOARDS:-opensearchproject/opensearch-dashboards:3}"
    container_name: "${PROJECT_PREFIX:-dwe}-${PROJECT_NAME:-magento}-opensearch-dashboards"
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5612}:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
