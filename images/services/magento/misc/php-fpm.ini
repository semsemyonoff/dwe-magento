memory_limit = 4G

; OPcache (statically built into PHP 8.5). Magento-tuned for local dev: code is
; cached but mtime is checked every request so source edits are picked up
; immediately. Bump opcache.memory_consumption / max_accelerated_files for the
; large Magento codebase.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 130987
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
